[project]
name = "trnopt"
version = "0.2.0"
description = "Entropic optimal transport (Sinkhorn) on AWS Trainium: a fused NKI kernel and a single-cell application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
]

[project.optional-dependencies]
# examples/singlecell_wot.py, singlecell_figures.py. The wot comparison also needs `pip install --no-deps wot`.
singlecell = ["anndata>=0.10", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "pot>=0.9", "statsmodels>=0.14", "gdown>=5.0"]

[dependency-groups]
dev = ["pytest>=8", "pot>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trnopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
